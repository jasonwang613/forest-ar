<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a241c" />
  <meta name="forest-version" content="3-dense-hands" />
  <title>林間漫步</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=&apos;http://www.w3.org/2000/svg&apos; viewBox=&apos;0 0 64 64&apos;><rect fill=&apos;%230a241c&apos; width=&apos;64&apos; height=&apos;64&apos;/><path fill=&apos;%23c8d63a&apos; d=&apos;M32 8 C20 22 18 34 32 56 C46 34 44 22 32 8Z&apos;/><circle cx=&apos;48&apos; cy=&apos;42&apos; r=&apos;5&apos; fill=&apos;%23ef7aa8&apos;/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --moss:#0a241c; --gold:#e8e47a; --cream:#f3f0d8; --mist:#c5d8c0; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; width:100%; height:100%; height:100dvh; overflow:hidden; background:var(--moss); color:var(--cream);
      font-family:"LXGW WenKai TC","Noto Serif TC","Songti TC",serif; touch-action:none; user-select:none; -webkit-user-select:none; }
    #cam, #view { position:fixed; inset:0; width:100%; height:100%; }
    #cam { z-index:0; object-fit:cover; display:none; background:#000; }
    body.is-ar #cam { display:block; }
    body.is-ar.is-front #cam { transform:scaleX(-1); }
    #view { z-index:1; display:block; }
    #hud { position:fixed; z-index:3; inset:0; pointer-events:none; }
    #hud button { pointer-events:auto; }
    #modeBtn { position:absolute; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right));
      border:1px solid rgba(243,240,216,.35); background:rgba(10,36,28,.55); color:var(--cream);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-family:inherit; font-size:15px;
      letter-spacing:.12em; padding:10px 16px; border-radius:999px; display:none; cursor:pointer; }
    body.is-in #modeBtn { display:block; }
    #modeBtn:active { transform:scale(.97); }
    #camBtn { position:absolute; top:max(14px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left));
      border:1px solid rgba(243,240,216,.35); background:rgba(10,36,28,.55); color:var(--cream);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-family:inherit; font-size:15px;
      letter-spacing:.12em; padding:10px 16px; border-radius:999px; display:none; cursor:pointer; }
    body.is-in.is-ar #camBtn { display:block; }
    #camBtn:active { transform:scale(.97); }
    #hint, #toast { position:absolute; left:50%; transform:translateX(-50%); text-align:center; padding:8px 16px;
      border-radius:999px; background:rgba(10,36,28,.5); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      font-size:14px; letter-spacing:.08em; opacity:0; transition:opacity .6s ease; max-width:min(90vw,420px); }
    #hint { bottom:max(28px,env(safe-area-inset-bottom)); }
    #toast { top:max(64px,calc(env(safe-area-inset-top) + 56px)); }
    #hint.show, #toast.show { opacity:1; }
    #start { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center;
      justify-content:flex-end; padding:0 28px max(48px,env(safe-area-inset-bottom)); overflow:hidden; background:#0a241c; }
    #start.gone { opacity:0; pointer-events:none; transition:opacity .8s ease; }
    #startBg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
    .copy, #enter, .note { position:relative; z-index:2; }
    .copy { text-align:center; margin-bottom:28px; animation:rise 1.2s ease both; }
    @keyframes rise { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .eyebrow { letter-spacing:.42em; font-size:12px; color:var(--gold); margin-bottom:10px; text-shadow:0 2px 10px rgba(0,0,0,.45); }
    h1 { font-weight:700; font-size:clamp(42px,11vw,68px); letter-spacing:.22em; margin:0 0 12px .22em; text-shadow:0 8px 28px rgba(0,0,0,.55); }
    .sub { font-size:16px; letter-spacing:.16em; color:var(--mist); line-height:1.8; text-shadow:0 2px 10px rgba(0,0,0,.5); }
    #enter { width:min(86vw,360px); border:1px solid var(--gold); background:linear-gradient(180deg,#2a5a3a 0%,#12352a 100%);
      color:var(--cream); font-family:inherit; font-size:22px; font-weight:700; letter-spacing:.28em;
      padding:16px 24px 16px 36px; border-radius:999px; box-shadow:0 0 0 1px rgba(232,228,122,.2),0 12px 40px rgba(0,0,0,.35);
      cursor:pointer; animation:rise 1.2s ease .15s both, pulse 2.8s ease-in-out 1.4s infinite; }
    #enter:disabled { opacity:.7; animation:none; }
    #enter:active { transform:scale(.98); }
    @keyframes pulse {
      0%,100%{box-shadow:0 0 0 1px rgba(232,228,122,.2),0 12px 40px rgba(0,0,0,.35)}
      50%{box-shadow:0 0 0 6px rgba(232,228,122,.14),0 12px 40px rgba(0,0,0,.35)}
    }
    .note { margin-top:16px; margin-bottom:12px; font-size:12px; letter-spacing:.1em; color:rgba(197,216,192,.8);
      text-align:center; line-height:1.7; text-shadow:0 2px 8px rgba(0,0,0,.5); animation:rise 1.2s ease .25s both; }
  </style>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="view"></canvas>
  <div id="hud">
    <button type="button" id="camBtn">切換鏡頭</button>
    <button type="button" id="modeBtn">純森林模式</button>
    <div id="toast" role="status"></div>
    <div id="hint">轉動手機，環顧這片森林</div>
  </div>
  <div id="start">
    <canvas id="startBg"></canvas>
    <div class="copy">
      <div class="eyebrow">FOREST WALK</div>
      <h1>林間漫步</h1>
      <div class="sub">轉動手機，走進層層葉影的叢林</div>
    </div>
    <button type="button" id="enter">進入森林</button>
    <div class="note">首次進入會詢問運動感測器與相機權限<br />相機無法開啟時，會自動改為純森林模式</div>
  </div>
  <script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const $ = (id) => document.getElementById(id);
const startEl = $('start');
const enterBtn = $('enter');
const modeBtn = $('modeBtn');
const camBtn = $('camBtn');
const toastEl = $('toast');
const hintEl = $('hint');
const videoEl = $('cam');
const canvas = $('view');

function mulberry32(a) {
  return function () {
    let t = (a += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20261122);
const rand = (a, b) => a + rng() * (b - a);
const pick = (arr) => arr[(rng() * arr.length) | 0];
const rrng = (r, a, b) => a + r() * (b - a);

let mode = 'vr';
let cameraReady = false;
let mediaStream = null;
let facing = 'environment';
let started = false;
let gotGyro = false;
let orientEvent = null;
let toastTimer = 0, hintTimer = 0;

function toast(msg, ms = 3400) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}
function showHint(msg, ms = 5000) {
  hintEl.textContent = msg;
  hintEl.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hintEl.classList.remove('show'), ms);
}

const PAL = {
  yellow: ['#f4f28c', '#e6e458', '#d5dc4a', '#c8d23c', '#f0e470'],
  lime: ['#b8d64c', '#9ecf3a', '#c6e258', '#a8c844'],
  mid: ['#58a838', '#6bb444', '#4a9a30', '#7cbc50'],
  fresh: ['#34a858', '#2c9a4e', '#48b868', '#1e8a44'],
  teal: ['#1a8a68', '#147a5a', '#228e70', '#0e6c50', '#1c7a60'],
  dark: ['#0d4a38', '#0a3a2c', '#124830', '#0c3328', '#165040'],
  deep: ['#07241c', '#0a1c16', '#0b2a22', '#061812'],
  branch: ['#6b3a24', '#5a2e1c', '#4a2418', '#7a4630', '#3e1e14'],
  pink: ['#ef7aa8', '#f090b8', '#e86898', '#f4a0c0'],
  purple: ['#d080c8', '#c070b8', '#e0a0d8', '#c888c0'],
  center: '#f8e8a0',
};

function hexRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function mixHex(a, b, t) {
  const A = hexRgb(a), B = hexRgb(b);
  const r = (A[0] + (B[0]-A[0])*t + 0.5) | 0;
  const g = (A[1] + (B[1]-A[1])*t + 0.5) | 0;
  const bl = (A[2] + (B[2]-A[2])*t + 0.5) | 0;
  return `rgb(${r},${g},${bl})`;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function drawOvate(ctx, x, y, len, wid, ang, base, hi, stem) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  if (stem) {
    ctx.strokeStyle = stem;
    ctx.lineWidth = Math.max(2, wid * 0.07);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(0, 0);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-wid * 0.12, len * 0.06, -wid * 0.55, len * 0.28, -wid * 0.5, len * 0.52);
  ctx.bezierCurveTo(-wid * 0.42, len * 0.8, -wid * 0.14, len * 0.93, 0, len);
  ctx.bezierCurveTo(wid * 0.14, len * 0.93, wid * 0.42, len * 0.8, wid * 0.5, len * 0.52);
  ctx.bezierCurveTo(wid * 0.55, len * 0.28, wid * 0.12, len * 0.06, 0, 0);
  ctx.closePath();
  ctx.fillStyle = base;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.beginPath();
  ctx.moveTo(-wid, -2);
  ctx.quadraticCurveTo(wid * 0.08, len * 0.42, 0, len + 2);
  ctx.lineTo(-wid, len + 2);
  ctx.closePath();
  ctx.fillStyle = hi;
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,220,0.18)';
  ctx.lineWidth = Math.max(1.1, wid * 0.035);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, len * 0.05);
  ctx.quadraticCurveTo(wid * 0.04, len * 0.5, 0, len * 0.9);
  ctx.stroke();
  ctx.restore();
}

function drawLobed(ctx, x, y, len, wid, ang, base, hi, stem) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  if (stem) {
    ctx.strokeStyle = stem;
    ctx.lineWidth = Math.max(2.2, wid * 0.08);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.lineTo(0, 0);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-wid * 0.1, len * 0.05, -wid * 0.7, len * 0.15, -wid * 0.62, len * 0.38);
  ctx.bezierCurveTo(-wid * 0.7, len * 0.5, -wid * 0.25, len * 0.5, -wid * 0.3, len * 0.62);
  ctx.bezierCurveTo(-wid * 0.4, len * 0.88, -wid * 0.08, len * 0.98, 0, len);
  ctx.bezierCurveTo(wid * 0.08, len * 0.98, wid * 0.4, len * 0.88, wid * 0.3, len * 0.62);
  ctx.bezierCurveTo(wid * 0.25, len * 0.5, wid * 0.7, len * 0.5, wid * 0.62, len * 0.38);
  ctx.bezierCurveTo(wid * 0.7, len * 0.15, wid * 0.1, len * 0.05, 0, 0);
  ctx.closePath();
  ctx.fillStyle = base;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.beginPath();
  ctx.moveTo(-wid, -2);
  ctx.quadraticCurveTo(0, len * 0.4, -wid * 0.05, len);
  ctx.lineTo(-wid, len);
  ctx.closePath();
  ctx.fillStyle = hi;
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,220,0.16)';
  ctx.lineWidth = Math.max(1.2, wid * 0.03);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, len * 0.88);
  ctx.moveTo(0, len * 0.22);
  ctx.quadraticCurveTo(-wid * 0.2, len * 0.32, -wid * 0.45, len * 0.38);
  ctx.moveTo(0, len * 0.22);
  ctx.quadraticCurveTo(wid * 0.2, len * 0.32, wid * 0.45, len * 0.38);
  ctx.stroke();
  ctx.restore();
}

function drawPinnate(ctx, x, y, len, wid, ang, base, hi, stem) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  const n = 7;
  ctx.strokeStyle = stem || mixHex(base, '#3a2010', 0.4);
  ctx.lineWidth = Math.max(2, wid * 0.08);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.lineTo(0, len * 0.96);
  ctx.stroke();
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const yy = len * (0.12 + t * 0.82);
    const s = (1 - t * 0.62) * wid;
    const side = i === n - 1 ? 0 : (i % 2 === 0 ? -1 : 1);
    if (i === n - 1) drawOvate(ctx, 0, yy, s * 0.9, s * 0.38, -0.05, base, hi, null);
    else drawOvate(ctx, 0, yy, s, s * 0.42, side * (0.85 + t * 0.15), i % 3 === 0 ? hi : base, i % 3 === 0 ? mixHex(hi, '#fff6a0', 0.3) : hi, null);
  }
  ctx.restore();
}

function drawFern(ctx, x, y, len, wid, ang, base, hi, stem) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.strokeStyle = stem || mixHex(base, '#2a4010', 0.3);
  ctx.lineWidth = Math.max(1.6, wid * 0.06);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.quadraticCurveTo(wid * 0.08, len * 0.5, 0, len);
  ctx.stroke();
  const pairs = 11;
  for (let i = 0; i < pairs; i++) {
    const t = i / pairs;
    const yy = len * (0.08 + t * 0.86);
    const s = (1 - t * 0.7) * wid * 0.95;
    const col = i % 2 === 0 ? base : hi;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(0, yy);
      ctx.rotate(side * (0.95 - t * 0.2));
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(s * 0.2, s * 0.1, s * 0.7, s * 0.15, s, 0);
      ctx.bezierCurveTo(s * 0.7, s * 0.45, s * 0.2, s * 0.35, 0, 0);
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawCluster(ctx, x, y, size, ang, colors, stem) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  const st = stem || PAL.branch[0];
  ctx.strokeStyle = st;
  ctx.lineWidth = Math.max(2, size * 0.05);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 10);
  ctx.quadraticCurveTo(size * 0.05, size * 0.4, 0, size * 0.7);
  ctx.stroke();
  const n = 7;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const a = -0.9 + t * 1.8;
    const yy = size * (0.15 + t * 0.55);
    const L = size * (0.35 + (i % 3) * 0.08);
    const W = L * 0.52;
    const base = colors[i % colors.length];
    const hi = mixHex(base, '#e8f090', 0.35);
    drawOvate(ctx, 0, yy, L, W, a, base, hi, null);
  }
  ctx.restore();
}

function drawFlower(ctx, x, y, r, petal, center, n = 5) {
  ctx.save();
  ctx.translate(x, y);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    ctx.save();
    ctx.rotate(a);
    ctx.beginPath();
    ctx.ellipse(0, r * 0.55, r * 0.38, r * 0.55, 0, 0, Math.PI * 2);
    ctx.fillStyle = petal;
    ctx.fill();
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = center;
  ctx.fill();
  ctx.restore();
}

function drawSprig(ctx, x, y, len, ang, petal, leafCol, stem) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.strokeStyle = stem || '#3a5a28';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.quadraticCurveTo(6, len * 0.5, 0, len);
  ctx.stroke();
  for (let i = 0; i < 5; i++) {
    const t = 0.18 + i * 0.16;
    const side = i % 2 === 0 ? -1 : 1;
    const xx = side * (8 + i * 2);
    const yy = len * t;
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(xx, yy - 4);
    ctx.stroke();
    if (i < 2) drawOvate(ctx, xx * 0.4, yy, 16, 9, side * 0.8, leafCol, mixHex(leafCol, '#d0e070', 0.4), null);
    drawFlower(ctx, xx, yy - 4, 7 + (i % 3), petal, PAL.center, 5);
  }
  ctx.restore();
}

function drawBranch(ctx, w, h, r) {
  const st = pick(PAL.branch);
  ctx.strokeStyle = st;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const x0 = w * 0.15, y0 = h * 0.08;
  const x2 = w * 0.85, y2 = h * 0.88;
  ctx.lineWidth = 16;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo(w * 0.28, h * 0.3, w * 0.55, h * 0.6);
  ctx.stroke();
  ctx.lineWidth = 9;
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(w * 0.42, h * 0.42);
  ctx.quadraticCurveTo(w * 0.6, h * 0.55, w * 0.72, h * 0.68);
  ctx.stroke();
  const cols = r() < 0.5 ? PAL.yellow : PAL.teal;
  for (let i = 0; i < 6; i++) {
    const t = 0.25 + i * 0.12;
    const x = x0 + (x2 - x0) * t + rrng(r, -10, 10);
    const y = y0 + (y2 - y0) * t + rrng(r, -8, 8);
    const base = cols[i % cols.length];
    drawOvate(ctx, x, y, rrng(r, 70, 130), rrng(r, 32, 58), rrng(r, -1.4, 0.2), base, mixHex(base, '#f0f090', 0.4), st);
  }
}

function paintTile(ctx, w, h, kind, r, palettes) {
  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(0, h);
  ctx.scale(1, -1);
  const stem = PAL.branch[(r() * PAL.branch.length) | 0];
  const pals = palettes || [PAL.yellow, PAL.lime, PAL.mid, PAL.fresh, PAL.teal, PAL.dark];
  const pal = pals[(r() * pals.length) | 0];
  const base = pal[(r() * pal.length) | 0];
  const hi = mixHex(base, '#f8f6a0', 0.5);
  const cx = w * 0.5;
  if (kind === 'ovate') drawOvate(ctx, cx, h * 0.08, h * 0.84, w * rrng(r, 0.28, 0.4), rrng(r, -0.2, 0.2), base, hi, stem);
  else if (kind === 'lobed') drawLobed(ctx, cx, h * 0.1, h * 0.82, w * 0.42, rrng(r, -0.15, 0.15), base, hi, stem);
  else if (kind === 'pinnate') drawPinnate(ctx, cx, h * 0.05, h * 0.9, w * 0.28, rrng(r, -0.12, 0.12), base, hi, stem);
  else if (kind === 'fern') {
    const b = pal[(r() * pal.length) | 0];
    drawFern(ctx, cx, h * 0.05, h * 0.9, w * 0.28, rrng(r, -0.1, 0.1), b, mixHex(b, '#f0f080', 0.4), stem);
  } else if (kind === 'cluster') {
    drawCluster(ctx, cx, h * 0.08, h * 0.85, rrng(r, -0.15, 0.15), pal, stem);
  } else if (kind === 'flowers') {
    const petal = r() < 0.5 ? PAL.pink[(r()*PAL.pink.length)|0] : PAL.purple[(r()*PAL.purple.length)|0];
    const leaf = pal[(r()*pal.length)|0];
    drawSprig(ctx, cx, h * 0.08, h * 0.82, rrng(r, -0.12, 0.12), petal, leaf, PAL.fresh[0]);
    if (r() < 0.7) drawSprig(ctx, w * 0.28, h * 0.2, h * 0.55, -0.35, petal, leaf, PAL.fresh[1]);
  } else if (kind === 'branch') {
    drawBranch(ctx, w, h, r);
  }
  ctx.restore();
}

function buildAtlas(size, cols, rows, painter) {
  const c = makeCanvas(size, size);
  const ctx = c.getContext('2d');
  const tw = size / cols, th = size / rows;
  const tiles = [];
  for (let i = 0; i < cols * rows; i++) {
    const x = (i % cols) * tw;
    const y = ((i / cols) | 0) * th;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, tw, th);
    ctx.clip();
    ctx.translate(x, y);
    painter(ctx, tw, th, i);
    ctx.restore();
    tiles.push({
      u: x / size,
      v: 1 - (y + th) / size,
      su: tw / size,
      sv: th / size,
    });
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = 4;
  tex.needsUpdate = true;
  return { canvas: c, texture: tex, tiles, tw, th, size };
}

function flyPath(a, dt) {

      const fr = (a.walkT * 6) % 2 < 1 ? 0 : 1;
      if (fr !== a.mesh.userData.frame) applyAniUV(a.mesh, fr);
      if (a.timer <= 0) startLeave(a);
    }
  }
}

/* Hand parting: MediaPipe Tasks Vision HandLandmarker, AR only, fail-safe. */
const HAND_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const HAND_TIP_IDX = [0, 5, 8, 9, 12, 16, 20];

let handLandmarker = null;
let handsReady = false;
let handsFailed = false;
let handsLoading = false;
let handsScreen = [];
let prevPalms = [];
let inferAccum = 0;
const _proj = new THREE.Vector3();

async function ensureHandTracker() {
  if (handsReady || handsFailed || handsLoading) return;
  handsLoading = true;
  try {
    const mod = await import(HAND_CDN + '/vision_bundle.mjs');
    const vision = await mod.FilesetResolver.forVisionTasks(HAND_CDN + '/wasm');
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: HAND_MODEL, delegate },
      runningMode: 'VIDEO',
      numHands: 2,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5,
    });
    try {
      handLandmarker = await mod.HandLandmarker.createFromOptions(vision, opts('GPU'));
    } catch (err) {
      handLandmarker = await mod.HandLandmarker.createFromOptions(vision, opts('CPU'));
    }
    handsReady = true;
  } catch (err) {
    handsFailed = true;
    handLandmarker = null;
    console.warn('Hand tracking unavailable', err);
  } finally {
    handsLoading = false;
  }
}

function videoToScreen(nx, ny) {
  const vw = videoEl.videoWidth || 1;
  const vh = videoEl.videoHeight || 1;
  const sw = window.innerWidth;
  const sh = window.innerHeight;
  const va = vw / vh;
  const sa = sw / sh;
  let fw, fh, fx, fy;
  if (va > sa) { fh = sh; fw = sh * va; fx = (sw - fw) * 0.5; fy = 0; }
  else { fw = sw; fh = sw / va; fx = 0; fy = (sh - fh) * 0.5; }
  let x = fx + nx * fw;
  const y = fy + ny * fh;
  if (facing === 'user') x = sw - x;
  return { x, y };
}

function sampleHands(now, dt) {
  if (mode !== 'ar' || !handsReady || !handLandmarker || !videoEl.videoWidth) {
    if (mode !== 'ar') { handsScreen = []; prevPalms = []; }
    return;
  }
  inferAccum += dt;
  if (inferAccum < 0.04) return;
  const step = inferAccum;
  inferAccum = 0;
  try {
    const res = handLandmarker.detectForVideo(videoEl, now);
    const curr = [];
    const lms = (res && res.landmarks) ? res.landmarks : [];
    for (const lm of lms) {
      const palm = lm[9] || lm[0];
      if (!palm) continue;
      const p = videoToScreen(palm.x, palm.y);
      const tips = [];
      for (const idx of HAND_TIP_IDX) {
        if (lm[idx]) tips.push(videoToScreen(lm[idx].x, lm[idx].y));
      }
      curr.push({ x: p.x, y: p.y, tips });
    }
    const next = [];
    for (const h of curr) {
      let vx = 0, vy = 0, best = 1e9;
      for (const p of prevPalms) {
        const d = Math.hypot(h.x - p.x, h.y - p.y);
        if (d < best) {
          best = d;
          vx = (h.x - p.x) / Math.max(step, 0.04);
          vy = (h.y - p.y) / Math.max(step, 0.04);
        }
      }
      next.push({ x: h.x, y: h.y, vx, vy, speed: Math.hypot(vx, vy), tips: h.tips });
    }
    handsScreen = next;
    prevPalms = curr.map((h) => ({ x: h.x, y: h.y }));
  } catch (err) {
    /* skip a bad frame; never break the loop */
  }
}

function gatherHandPoints() {
  const pts = [];
  for (const h of handsScreen) {
    pts.push(h);
    if (h.tips) {
      for (const t of h.tips) pts.push({ x: t.x, y: t.y, vx: h.vx, vy: h.vy, speed: h.speed });
    }
  }
  return pts;
}

function springAxis(pos, vel, force, dt, spring, damp) {
  vel += force * dt;
  vel -= pos * spring * dt;
  vel *= Math.exp(-damp * dt);
  pos += vel * dt;
  return [pos, vel];
}

function applyPushAtScreen(sx, sy, pts, R, out) {
  let fx = 0, fy = 0, fa = 0;
  for (const h of pts) {
    const dx = sx - h.x;
    const dy = sy - h.y;
    const dist = Math.hypot(dx, dy);
    if (dist >= R) continue;
    const fall = 1 - dist / R;
    const fall2 = fall * fall;
    const boost = 1 + Math.min(h.speed, 2000) / 380;
    const mag = fall2 * boost;
    let nx = dx, ny = dy;
    if (dist < 6) { nx = h.vx || 1; ny = h.vy || 0; const n = Math.hypot(nx, ny) || 1; nx /= n; ny /= n; }
    else { nx /= dist; ny /= dist; }
    // Prefer parting sideways when the hand is moving horizontally or waving.
    if (Math.abs(h.vx) > Math.abs(h.vy) * 0.6) nx = Math.sign(nx || h.vx || 1);
    fx += nx * mag * 2.4;
    fy += ny * mag * 1.35;
    fa += nx * mag * 1.1;
  }
  out[0] = fx; out[1] = fy; out[2] = fa;
}

const _force = [0, 0, 0];

function updateLeafPush(dt) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const pts = (mode === 'ar' && handsScreen.length) ? gatherHandPoints() : [];
  const R = 0.28 * Math.min(w, h);
  const aspect = w / Math.max(h, 1);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const halfH = Math.tan(fov * 0.5);

  if (pts.length) {
    for (let i = 0; i < leafInfo.length; i++) {
      const L = leafInfo[i];
      if (mode === 'ar' && L.depth > 10) continue;
      _proj.set(L.x, L.y, L.z).project(camera);
      if (_proj.z >= 1) continue;
      const sx = (_proj.x * 0.5 + 0.5) * w;
      const sy = (-_proj.y * 0.5 + 0.5) * h;
      applyPushAtScreen(sx, sy, pts, R, _force);
      const ix = i * 4;
      let px = aPush[ix], py = aPush[ix + 1], pr = aPush[ix + 2];
      let vx = pushVel[ix], vy = pushVel[ix + 1], vr = pushVel[ix + 2];
      [px, vx] = springAxis(px, vx, _force[0], dt, 16, 5.2);
      [py, vy] = springAxis(py, vy, _force[1] * 0.85, dt, 16, 5.2);
      [pr, vr] = springAxis(pr, vr, _force[2], dt, 18, 5.6);
      aPush[ix] = Math.max(-2.2, Math.min(2.2, px));
      aPush[ix + 1] = Math.max(-1.6, Math.min(1.6, py));
      aPush[ix + 2] = Math.max(-1.2, Math.min(1.2, pr));
      pushVel[ix] = vx; pushVel[ix + 1] = vy; pushVel[ix + 2] = vr;
    }
    pushAttr.needsUpdate = true;
  } else {
    let any = false;
    for (let i = 0; i < LEAF_N; i++) {
      const ix = i * 4;
      if (aPush[ix] === 0 && aPush[ix + 1] === 0 && aPush[ix + 2] === 0 &&
          pushVel[ix] === 0 && pushVel[ix + 1] === 0 && pushVel[ix + 2] === 0) continue;
      any = true;
      let px = aPush[ix], py = aPush[ix + 1], pr = aPush[ix + 2];
      let vx = pushVel[ix], vy = pushVel[ix + 1], vr = pushVel[ix + 2];
      [px, vx] = springAxis(px, vx, 0, dt, 16, 5.2);
      [py, vy] = springAxis(py, vy, 0, dt, 16, 5.2);
      [pr, vr] = springAxis(pr, vr, 0, dt, 18, 5.6);
      if (Math.abs(px) < 0.002 && Math.abs(vx) < 0.002) { px = 0; vx = 0; }
      if (Math.abs(py) < 0.002 && Math.abs(vy) < 0.002) { py = 0; vy = 0; }
      if (Math.abs(pr) < 0.002 && Math.abs(vr) < 0.002) { pr = 0; vr = 0; }
      aPush[ix] = px; aPush[ix + 1] = py; aPush[ix + 2] = pr;
      pushVel[ix] = vx; pushVel[ix + 1] = vy; pushVel[ix + 2] = vr;
    }
    if (any) pushAttr.needsUpdate = true;
  }

  for (const m of frameLeaves) {
    const u = m.userData;
    let fx = 0, fy = 0, fa = 0;
    if (pts.length) {
      const zAbs = Math.abs(u.bz) || 1.4;
      const hh = halfH * zAbs;
      const hw = hh * aspect;
      const sx = (u.bx / hw * 0.5 + 0.5) * w;
      const sy = (-u.by / hh * 0.5 + 0.5) * h;
      applyPushAtScreen(sx, sy, pts, R * 1.05, _force);
      fx = _force[0]; fy = _force[1]; fa = _force[2];
    }
    [u.px, u.vx] = springAxis(u.px, u.vx, fx * 0.55, dt, 18, 5.4);
    [u.py, u.vy] = springAxis(u.py, u.vy, fy * 0.45, dt, 18, 5.4);
    [u.pr, u.vr] = springAxis(u.pr, u.vr, fa * 0.7, dt, 20, 5.8);
    u.px = Math.max(-0.55, Math.min(0.55, u.px));
    u.py = Math.max(-0.35, Math.min(0.35, u.py));
    u.pr = Math.max(-0.7, Math.min(0.7, u.pr));
  }
}

function updateFrameSway(t) {
  for (const m of frameLeaves) {
    const u = m.userData;
    m.rotation.z = u.br + Math.sin(t * 1.6 + u.phase) * u.sway + u.pr;
    m.position.x = u.bx + Math.sin(t * 1.2 + u.phase) * u.sway * 0.8 + u.px;
    m.position.y = u.by + u.py;
  }
}
const _zee = new THREE.Vector3(0, 0, 1);
const _euler = new THREE.Euler();
const _q0 = new THREE.Quaternion();
const _q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const _qOrient = new THREE.Quaternion();

function screenOrientationDeg() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  if (typeof window.orientation === 'number') return window.orientation;
  return 0;
}
function applyDeviceOrientation(event) {
  const alpha = event.alpha != null ? THREE.MathUtils.degToRad(event.alpha) : 0;
  const beta = event.beta != null ? THREE.MathUtils.degToRad(event.beta) : 0;
  const gamma = event.gamma != null ? THREE.MathUtils.degToRad(event.gamma) : 0;
  const orient = THREE.MathUtils.degToRad(screenOrientationDeg());
  _euler.set(beta, alpha, -gamma, 'YXZ');
  _qOrient.setFromEuler(_euler);
  _qOrient.multiply(_q1);
  _qOrient.multiply(_q0.setFromAxisAngle(_zee, -orient));
  camera.quaternion.copy(_qOrient);
}

let dragging = false, lastX = 0, lastY = 0;
const LOOK_YAW = Math.atan2(-GLOW_DIRS[0].x, -GLOW_DIRS[0].z);
let yaw = LOOK_YAW, pitch = 0.04;

function onPointerDown(e) {
  if (gotGyro) return;
  dragging = true;
  lastX = e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0;
  lastY = e.clientY ?? (e.touches && e.touches[0].clientY) ?? 0;
}
function onPointerMove(e) {
  if (!dragging || gotGyro) return;
  const x = e.clientX ?? (e.touches && e.touches[0].clientX);
  const y = e.clientY ?? (e.touches && e.touches[0].clientY);
  if (x == null) return;
  yaw -= (x - lastX) * 0.005;
  pitch -= (y - lastY) * 0.005;
  pitch = Math.max(-1.15, Math.min(1.15, pitch));
  lastX = x; lastY = y;
}
function onPointerUp() { dragging = false; }
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

function onOrient(e) {
  if (e.alpha == null && e.beta == null) return;
  gotGyro = true;
  orientEvent = e;
}
function enableGyroListener() {
  window.addEventListener('deviceorientation', onOrient, true);
  window.addEventListener('deviceorientationabsolute', onOrient, true);
}
function applyLook() {
  if (gotGyro && orientEvent) applyDeviceOrientation(orientEvent);
  else camera.rotation.set(pitch, yaw, 0, 'YXZ');
  camera.position.set(0, 1.5, 0);
}

async function requestOrientationPermission() {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res === 'granted') { enableGyroListener(); return true; }
      return false;
    }
    enableGyroListener();
    return true;
  } catch (err) {
    enableGyroListener();
    return false;
  }
}
async function requestCamera(nextFacing) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no media');
  const want = nextFacing || facing || 'environment';
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: want }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false,
  });
  if (mediaStream) {
    try { mediaStream.getTracks().forEach((tr) => tr.stop()); } catch (err) {}
  }
  facing = want;
  document.body.classList.toggle('is-front', facing === 'user');
  videoEl.srcObject = stream;
  videoEl.setAttribute('playsinline', 'true');
  videoEl.muted = true;
  await videoEl.play();
  mediaStream = stream;
  cameraReady = true;
  ensureHandTracker();
}

function setMode(next) {
  mode = next;
  const isAR = mode === 'ar';
  document.body.classList.toggle('is-ar', isAR);
  vrGroup.visible = !isAR;
  leafUniforms.arOpen.value = isAR ? 1 : 0;
  if (isAR) {
    renderer.setClearColor(0x000000, 0);
    leafUniforms.fogNear.value = 40;
    leafUniforms.fogFar.value = 80;
    for (const L of leafInfo) {
      dummy.position.set(L.x, L.y, L.z);
      dummy.scale.set(L.depth > 10 ? 0 : L.sx, L.depth > 10 ? 0 : L.sy, 1);
      dummy.updateMatrix();
      leaves.setMatrixAt(L.i, dummy.matrix);
    }
    leaves.instanceMatrix.needsUpdate = true;
    modeBtn.textContent = '純森林模式';
    if (cameraReady) ensureHandTracker();
  } else {
    renderer.setClearColor(0x0a2a20, 1);
    leafUniforms.fogNear.value = 10;
    leafUniforms.fogFar.value = 26;
    handsScreen = [];
    prevPalms = [];
    for (const L of leafInfo) {
      dummy.position.set(L.x, L.y, L.z);
      dummy.scale.set(L.sx, L.sy, 1);
      dummy.updateMatrix();
      leaves.setMatrixAt(L.i, dummy.matrix);
    }
    leaves.instanceMatrix.needsUpdate = true;
    modeBtn.textContent = '鏡頭實境';
  }
}

modeBtn.addEventListener('click', async () => {
  if (mode === 'ar') { setMode('vr'); return; }
  if (!cameraReady) {
    try { await requestCamera(facing || 'environment'); setMode('ar'); showHint('把手伸到鏡頭前撥開葉子'); }
    catch (err) { toast('無法開啟相機，仍使用純森林模式'); }
    return;
  }
  setMode('ar');
  showHint('把手伸到鏡頭前撥開葉子');
});

camBtn.addEventListener('click', async () => {
  if (mode !== 'ar') return;
  const next = facing === 'user' ? 'environment' : 'user';
  try {
    await requestCamera(next);
    showHint(next === 'user' ? '已切到前鏡頭，把手伸到鏡頭前撥開葉子' : '已切到後鏡頭，把手伸到鏡頭前撥開葉子');
  } catch (err) {
    toast('無法切換鏡頭');
  }
});

let lastT = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  applyLook();
  const t = now * 0.001;
  leafUniforms.time.value = t;
  if (rustlePoints.length) {
    let sx = 0, sy = 0, sz = 0, ss = 0, n = 0;
    for (let i = rustlePoints.length - 1; i >= 0; i--) {
      const r = rustlePoints[i];
      r.life -= dt;
      if (r.life <= 0) { rustlePoints.splice(i, 1); continue; }
      sx += r.pos.x; sy += r.pos.y; sz += r.pos.z; ss += r.s * (r.life / 0.8); n++;
    }
    if (n) leafUniforms.rustle.value.set(sx / n, sy / n, sz / n, ss / n);
    else leafUniforms.rustle.value.w = 0;
  } else {
    leafUniforms.rustle.value.w = 0;
  }
  sampleHands(now, dt);
  updateLeafPush(dt);
  updateFrameSway(t);
  updateAnimals(dt, t);
  const arr = pollen.geometry.attributes.position.array;
  for (let i = 0; i < POLE; i++) {
    const b = poleBase[i];
    arr[i*3] = b.x + Math.sin(t * b.s + b.ph) * 0.4;
    arr[i*3+1] = b.y + Math.sin(t * 0.9 * b.s + b.ph * 1.3) * 0.35;
    arr[i*3+2] = b.z + Math.cos(t * b.s + b.ph) * 0.4;
  }
  pollen.geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

async function enterForest(forceVR) {
  if (started) return;
  enterBtn.disabled = true;
  enterBtn.textContent = '進入中';
  const gyroOk = forceVR ? (enableGyroListener(), false) : await requestOrientationPermission();
  if (!forceVR) {
    try { await requestCamera(); } catch (err) { cameraReady = false; }
  }
  started = true;
  document.body.classList.add('is-in');
  if (forceVR || !cameraReady) {
    setMode('vr');
    if (!forceVR) toast('無法開啟相機，已切換為純森林模式');
  } else {
    setMode('ar');
  }
  startEl.classList.add('gone');
  setTimeout(() => { startEl.style.display = 'none'; }, 850);
  if (mode === 'ar') showHint('把手伸到鏡頭前撥開葉子');
  else if (gotGyro || gyroOk) showHint('轉動手機，看看葉子後面會不會探出小動物');
  else {
    setTimeout(() => {
      showHint(gotGyro ? '轉動手機，看看葉子後面會不會探出小動物' : '用手指拖曳畫面，即可轉視角');
    }, 900);
  }
  requestAnimationFrame(tick);
  document.body.dataset.ready = '1';
  document.body.dataset.version = '3-dense-hands';
}

enterBtn.addEventListener('click', () => enterForest(false));

function posePreview() {
  yaw = LOOK_YAW;
  pitch = 0.04;
  startEl.style.display = 'none';
  document.body.classList.add('is-in');
  setMode('vr');
  started = true;
  const front = dens
    .map((d) => ({ d, score: d.pos.clone().normalize().dot(GLOW_DIRS[0]) + (d.depth < 7 ? 0.2 : 0) }))
    .sort((a, b) => b.score - a.score);
  const land = animals.filter((a) => a.kind !== 'bird' && a.kind !== 'butterfly');
  const flyers = animals.filter((a) => a.kind === 'bird' || a.kind === 'butterfly');
  const roles = ['peek', 'out', 'peek', 'wander', 'pause', 'out'];
  for (let i = 0; i < Math.min(land.length, front.length, 6); i++) {
    const a = land[i];
    const den = front[i].d;
    a.den = den;
    a.peekSide = i % 2 === 0 ? -1 : 1;
    if (roles[i] === 'peek') {
      startPeek(a);
      a.phase = 0.85;
      a.pos.lerpVectors(a.from, a.to, 0.9);
      a.root.position.copy(a.pos);
      a.root.visible = true;
    } else if (roles[i] === 'out' || roles[i] === 'pause') {
      startOut(a);
      a.phase = 1;
      a.root.position.copy(a.to);
      a.pos.copy(a.to);
      a.root.visible = true;
      if (roles[i] === 'pause') startPause(a);
    } else {
      a.root.position.copy(outPos(den, a.peekSide, a.kind));
      a.pos.copy(a.root.position);
      a.depth = Math.hypot(a.pos.x, a.pos.z);
      a.yKeep = a.pos.y;
      a.yaw = Math.atan2(a.pos.x, a.pos.z);
      a.root.visible = true;
      startWander(a);
    }
  }
  for (let i = 0; i < flyers.length; i++) {
    const a = flyers[i];
    a.state = 'wander';
    a.timer = 8;
    a.root.visible = true;
    a.depth = 6 + (i % 5);
    a.yaw = LOOK_YAW + (i - 2) * 0.25;
    a.yKeep = 1.6 + (i % 3) * 0.5;
    a.turn = i % 2 ? 0.4 : -0.4;
    a.walkT = i * 0.4;
  }
  requestAnimationFrame(tick);
  document.body.dataset.ready = '1';
  document.body.dataset.version = '3-dense-hands';
}

const params = new URLSearchParams(location.search);
if (params.get('preview') === '1') posePreview();
